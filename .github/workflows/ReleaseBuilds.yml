name: Make Release Builds

on: [workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-12
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 13

      - run: bash build-mac-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: SpaceCadetPinball-*-mac.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build (x86 + x64)
        shell: pwsh
        run: ./BuildForWindows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: bin/SpaceCadetPinball*Win.zip
