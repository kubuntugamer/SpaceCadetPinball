name: Make Release Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag / release name. Leave empty to use Release_<VERSION>."
        required: false
        default: ""
      create_release:
        description: "Create a GitHub Release from the built artifacts"
        type: boolean
        default: false
  push:
    tags:
      - "Release_*"

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install dependencies
        run: brew install glfw vulkan-loader molten-vk fluid-synth dylibbundler

      - run: bash build-mac-app.sh
        env:
          CMAKE_OSX_ARCHITECTURES: arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: SpaceCadetPinball-*-mac.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build (x86 + x64)
        shell: pwsh
        run: ./BuildForWindows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: bin/SpaceCadetPinball*Win.zip

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libvulkan-dev libfluidsynth-dev rpm

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build packages (.deb, .rpm, archives, AppImage)
        run: |
          ./Platform/Linux/build-packages.sh
          ./Platform/Linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/spacecadetpinball_*.deb
            build/spacecadetpinball-*.rpm
            build/SpaceCadetPinball-*.tar.gz
            build/SpaceCadetPinball-*.zip
            bin/SpaceCadetPinball-*.AppImage

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'push' || inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Tag comes from the push (Release_*), or the manual input; if the input is
      # empty, it falls back to Release_<VERSION> so the VERSION file stays the
      # single source of truth.
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="Release_$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
