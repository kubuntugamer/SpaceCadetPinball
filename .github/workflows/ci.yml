name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libvulkan-dev libfluidsynth-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-linux-x86_64
          path: bin/SpaceCadetPinball

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_WIN32_EXECUTABLE:BOOL=1 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $dllDir = "build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $dllDir) { Copy-Item "$dllDir\*.dll" "bin\Release" -Force }
          if (-not (Test-Path "bin\Release\SpaceCadetPinball.exe")) {
            throw "SpaceCadetPinball.exe was not produced"
          }
          Get-ChildItem "bin\Release" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-windows-x64
          path: bin/Release/*
