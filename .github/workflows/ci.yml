name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust geometry
        run: cargo test --manifest-path rust/geometry/Cargo.toml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libvulkan-dev libfluidsynth-dev

      - name: Configure
        # No -DSCP_USE_RUST_GEOMETRY here: the Linux job exercises the default
        # configuration, so a broken default is caught rather than hidden.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCP_BUILD_PARITY_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Compare Rust maths against the C++ reference
        run: ./bin/maths_parity

      - name: Compare the Rust edge grid against the C++ reference
        run: ./bin/edgegrid_parity

      - name: Compare the Rust projection against the C++ reference
        run: ./bin/proj_parity

      - name: Compare the Rust ball step against the C++ reference
        run: ./bin/ballstep_parity

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-linux-x86_64
          path: bin/SpaceCadetPinball

  linux-cpp-world:
    # The Rust world is the default, so the job that leaves it off is the one that
    # keeps the original C++ grid walk compiling and linking.
    name: Linux (x86_64, C++ world)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglfw3-dev libvulkan-dev libfluidsynth-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCP_USE_RUST_WORLD=OFF

      - name: Build
        run: cmake --build build

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust geometry
        run: cargo test --manifest-path rust/geometry/Cargo.toml

      - name: Configure
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"
          # No -G: let CMake pick whichever Visual Studio the runner image has.
          # Naming a generator pins CI to one VS version and breaks when the
          # image moves on (BuildForWindows.ps1 works the same way).
          cmake -S . -B build -A x64 `
            -DCMAKE_WIN32_EXECUTABLE:BOOL=1 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DSCP_USE_RUST_GEOMETRY=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $dllDir = "build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $dllDir) { Copy-Item "$dllDir\*.dll" "bin\Release" -Force }
          if (-not (Test-Path "bin\Release\SpaceCadetPinball.exe")) {
            throw "SpaceCadetPinball.exe was not produced"
          }
          Get-ChildItem "bin\Release" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-windows-x64
          path: bin/Release/*
